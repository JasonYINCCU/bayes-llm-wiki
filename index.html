<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bayes' Theorem Interactive Lecture | 베이즈 정리 입문</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #eff6ff;
      --accent: #7c3aed;
      --accent-light: #f5f3ff;
      --success: #059669;
      --success-light: #ecfdf5;
      --danger: #dc2626;
      --danger-light: #fef2f2;
      --warning: #d97706;
      --warning-light: #fffbeb;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Progress Bar */
    .progress-container {
      width: 100%;
      height: 6px;
      background: #e2e8f0;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      width: 11.11%;
      transition: width 0.35s ease;
    }

    /* Main Slide Stage */
    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 24px 76px;
      overflow-y: auto;
    }

    .slide {
      display: none;
      width: 100%;
      max-width: 1060px;
      min-height: 560px;
      background: var(--card);
      border-radius: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 38px 46px;
      flex-direction: column;
      justify-content: space-between;
      animation: fadeIn 0.3s ease;
    }

    .slide.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Header & Wiki Tag */
    .slide-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      border-bottom: 2px solid var(--bg);
      padding-bottom: 16px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .slide-title-group h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.25;
    }

    .slide-title-group .en-sub {
      font-size: 0.98rem;
      color: var(--muted);
      font-weight: 500;
      margin-top: 4px;
    }

    .wiki-badge {
      background: var(--primary-light);
      color: var(--primary-dark);
      border: 1px solid #bfdbfe;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Content Layouts */
    .slide-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }

    .card h3 {
      font-size: 1.05rem;
      margin-bottom: 8px;
      color: var(--text);
    }

    .card p, .card li {
      font-size: 0.93rem;
      line-height: 1.6;
      color: #334155;
    }

    .en-text {
      display: block;
      font-size: 0.84rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Math Styling */
    .formula-box {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #f8fafc;
      padding: 22px 28px;
      border-radius: 16px;
      text-align: center;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.15);
    }

    .frac {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      margin: 0 6px;
    }

    .frac .num {
      border-bottom: 2px solid currentColor;
      padding: 0 8px 4px;
    }

    .frac .den {
      padding: 4px 8px 0;
    }

    .c-post { color: #38bdf8; }
    .c-like { color: #a78bfa; }
    .c-prior { color: #34d399; }
    .c-marg { color: #fbbf24; }

    /* Highlight Boxes */
    .callout {
      padding: 16px 20px;
      border-radius: 12px;
      border-left: 5px solid var(--primary);
      background: var(--primary-light);
      font-size: 0.95rem;
      line-height: 1.55;
    }

    .callout.warn {
      border-left-color: var(--danger);
      background: var(--danger-light);
    }

    .callout.success {
      border-left-color: var(--success);
      background: var(--success-light);
    }

    /* Title Slide Special */
    .hero {
      text-align: center;
      padding: 20px 10px;
    }

    .hero-tag {
      display: inline-block;
      background: var(--accent-light);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.85rem;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 18px;
    }

    .hero h1 {
      font-size: 2.6rem;
      font-weight: 900;
      line-height: 1.2;
      background: linear-gradient(135deg, var(--primary-dark), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .hero h2 {
      font-size: 1.25rem;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 28px;
    }

    /* Interactive Lab 1: Rare Disease */
    .sim-controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .slider-box {
      background: var(--bg);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .slider-box label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .
